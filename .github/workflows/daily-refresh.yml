name: Daily refresh checklist

# Opens a GitHub Issue listing every URL that needs manual refresh today.
# Sends an email notification via GitHub's default Watching subscription
# (no extra setup needed — repo owner is auto-watching).
#
# Schedule: 07:00 UTC (~03:00 ET / midnight PT). Picks up an hour after the
# Apify cron at 06:00 so the issue reflects the latest auto-scraped state.
#
# Manual trigger via workflow_dispatch is available — useful for testing
# without waiting for the cron, and for regenerating the issue if you
# accidentally close it before doing the updates.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Open today's refresh issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline/build_refresh_issue.py
