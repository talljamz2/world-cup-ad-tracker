name: Update ad metrics

on:
  schedule:
    # Top of every hour. Cron is in UTC.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Pull live YouTube metrics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/update_metrics.py

      - name: Commit refreshed data.json + history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # history.json is appended every run — committing it preserves the
          # trailing-7-day window across cron runs (without this, velocity resets).
          git add data.json pipeline/history.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "data: refresh metrics [skip ci]"
            git push
          fi
