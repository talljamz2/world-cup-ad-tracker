name: Daily discovery

# Runs discover.py to find new candidate ads and commits pipeline/candidates.json.
# The daily Cowork ritual ("daily-ad-podium-review" scheduled task) reads
# candidates.json directly each weekday morning and walks the user through
# triage — no GitHub Issue is created automatically anymore.
#
# Schedule: 05:00 UTC (~22:00 PT previous day). Lands before the Apify cron
# at 06:00 UTC so any candidates added that morning can be measured same-day.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run discovery scan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/discover.py

      - name: Commit refreshed candidates.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/candidates.json
          if git diff --cached --quiet; then
            echo "No candidate changes — skipping commit."
          else
            git commit -m "discovery: refresh candidates [skip ci]"
            git push
          fi
