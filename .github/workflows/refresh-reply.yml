name: Refresh reply parser

# Triggered when someone comments on a Daily Refresh issue.
# Parses structured update lines in the comment body, applies them to
# pipeline/ads.json, commits + pushes, and posts a confirmation reply.
#
# Security: only acts on comments from the repo owner. Random GitHub
# users commenting on the public repo cannot modify data.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  parse:
    runs-on: ubuntu-latest

    # Only act when:
    #   1. The issue is a Daily Refresh issue (title prefix match)
    #   2. The comment was posted by the repo owner (not a random visitor)
    #   3. We're not reacting to one of our own bot comments
    if: >-
      startsWith(github.event.issue.title, '🔄 Daily refresh') &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.user.type != 'Bot'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Parse comment and apply updates
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python pipeline/parse_refresh_reply.py

      - name: Commit + push updated ads.json
        if: steps.parse.outputs.did_update == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/ads.json
          if git diff --cached --quiet; then
            echo "Nothing actually changed in ads.json — skipping commit."
          else
            git commit -m "data: manual refresh from issue #${{ github.event.issue.number }} [skip ci]"
            git push
          fi

      - name: Reply with confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "${{ steps.parse.outputs.summary_path }}"
