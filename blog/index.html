<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — The Ad Podium</title>
<meta name="description" content="Analysis and commentary on World Cup 2026 brand advertising. The Ad Podium's editorial coverage of how brands are showing up at football's biggest tournament." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='20' width='8' height='9' fill='%230f5c3e' rx='1'/><rect x='12' y='12' width='8' height='17' fill='%23b8860b' rx='1'/><rect x='21' y='16' width='8' height='13' fill='%230f5c3e' rx='1'/></svg>" />
<style>
  :root {
    --bg: #faf7f0;
    --bg-card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #7a7a7a;
    --rule: #e8e2d4;
    --accent: #0f5c3e;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Apple Garamond", Cambria, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .container { max-width: 920px; margin: 0 auto; padding: 0 28px; }
  .topnav { border-bottom: 1px solid var(--rule); background: var(--bg); position: sticky; top: 0; z-index: 50; }
  .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; max-width: 1240px; margin: 0 auto; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; color: var(--ink); }
  .brand-mark { display: inline-block; width: 1.1em; height: 1.1em; margin-right: 0.42em; vertical-align: -0.2em; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='20' width='8' height='9' fill='%230f5c3e' rx='1'/><rect x='12' y='12' width='8' height='17' fill='%23b8860b' rx='1'/><rect x='21' y='16' width='8' height='13' fill='%230f5c3e' rx='1'/></svg>"); background-size: contain; background-repeat: no-repeat; background-position: center; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: var(--ink-soft); font-size: 14px; font-weight: 500; }
  .nav-links a:hover { color: var(--accent); text-decoration: none; }
  @media (max-width: 600px) { .nav-links { display: none; } }

  .hero { padding: 48px 0 24px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  h1.headline { font-family: var(--serif); font-weight: 700; font-size: clamp(34px, 5vw, 48px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px; }
  .deck { font-size: 18px; color: var(--ink-soft); max-width: 60ch; margin: 0 0 18px; }

  .post-list { margin-top: 32px; display: flex; flex-direction: column; gap: 24px; }
  .post-card { background: var(--bg-card); border: 1px solid var(--rule); border-radius: 6px; padding: 24px 28px; }
  .post-date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  .post-title { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 8px; }
  .post-title a { color: var(--ink); }
  .post-title a:hover { color: var(--accent); text-decoration: none; }
  .post-intro { color: var(--ink-soft); font-size: 15px; margin: 0; }
  .post-read-more { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--accent); }
  .empty-state { background: var(--bg-card); border: 1px solid var(--rule); border-radius: 6px; padding: 60px 28px; text-align: center; color: var(--ink-muted); }

  footer { margin-top: 64px; padding: 36px 0 48px; border-top: 2px solid var(--ink); color: var(--ink-muted); font-size: 13px; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="brand"><a href="../" style="color:var(--ink);text-decoration:none"><span class="brand-mark"></span>The Ad Podium</a></div>
    <div class="nav-links">
      <a href="../#leaderboard">Leaderboard</a>
      <a href="./">Blog</a>
      <a href="../#methodology">Methodology</a>
      <a href="../#about">About</a>
    </div>
  </div>
</nav>

<div class="container">
  <header class="hero">
    <div class="eyebrow">From the Editor</div>
    <h1 class="headline">Blog</h1>
    <p class="deck">
      Analysis and commentary on the brand creative running through the
      summer of football. New pieces as they're published.
    </p>
  </header>

  <div id="postList" class="post-list">
    <div class="empty-state">Articles coming soon.</div>
  </div>
</div>

<footer>
  <div class="container">
    <a href="../" style="color:var(--ink-soft)">← Back to leaderboard</a>
  </div>
</footer>

<script>
async function loadPosts() {
  let posts = [];
  try {
    const res = await fetch("posts.json", { cache: "no-store" });
    if (res.ok) posts = await res.json();
  } catch (e) { /* leave as empty */ }

  const el = document.getElementById("postList");
  if (!Array.isArray(posts) || posts.length === 0) return;

  posts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  el.innerHTML = posts.map(p => {
    const dateStr = p.date
      ? new Date(p.date).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
      : "";
    return `
      <article class="post-card">
        ${dateStr ? `<div class="post-date">${dateStr}</div>` : ""}
        <h2 class="post-title"><a href="${p.url}">${p.title}</a></h2>
        ${p.intro ? `<p class="post-intro">${p.intro}</p>` : ""}
        <a class="post-read-more" href="${p.url}">Read more →</a>
      </article>
    `;
  }).join("");
}
loadPosts();
</script>

</body>
</html>
